# nginx inside the Gatezo container. TLS is terminated by Caddy in front (compose.prod.yml).
server {
    listen 80 default_server;
    server_name _;
    root /var/www/gatezo/public;
    index index.php;

    client_max_body_size 10m;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Hashed Vite assets and Filament assets: cache forever.
    location ~ ^/(build|css/filament|js/filament|fonts)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker must never be cached by the browser.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
