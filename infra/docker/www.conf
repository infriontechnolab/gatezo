; php-fpm pool: small VPS, one event at a time. Tune pm.max_children with RAM (≈40 MB each).
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
