; php-fpm pool. Each worker is ~40 MB, so max_children ~= (RAM for PHP) / 40 MB:
; 2 GB box -> 12, 8 GB box -> 32. Gate scanning is bursty but tiny; this is sized so a
; registration rush never queues, while leaving the box's RAM to MySQL's buffer pool.
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 32
pm.start_servers = 4
pm.min_spare_servers = 3
pm.max_spare_servers = 8
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
