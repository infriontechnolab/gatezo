; Everything the app needs, in one container. Logs go to the container's stdout/stderr.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Reports/exports run through the database queue (no Redis).
[program:queue]
command=php artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/gatezo
user=www-data
autorestart=true
stopwaitsecs=3600
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Replaces the cron line: runs due scheduled commands every minute (demo reset etc.).
[program:scheduler]
command=php artisan schedule:work
directory=/var/www/gatezo
user=www-data
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
