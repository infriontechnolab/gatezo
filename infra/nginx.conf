# EventQR — single Laravel app (Filament admin + public pages + scanner).
# /etc/nginx/sites-available/eventqr → symlink into sites-enabled.
# TLS: run certbot after DNS points here, or terminate at Cloudflare (proxied) and keep this on 80.
server {
    listen 80;
    server_name eventqr.example.com;   # change
    root /var/www/eventqr/public;
    index index.php;

    client_max_body_size 10m;          # logos / posters
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Hashed Vite assets: cache forever.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker must never be cached by the browser.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
