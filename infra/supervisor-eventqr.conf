; /etc/supervisor/conf.d/eventqr.conf
; Queue worker for reports/exports. `database` driver, no Redis.
[program:eventqr-queue]
command=php /var/www/eventqr/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/eventqr
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/eventqr/storage/logs/queue.log
stopwaitsecs=3600
