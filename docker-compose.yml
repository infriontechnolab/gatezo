# Local dev MySQL only. Start: docker compose up -d
# Port 3308 so it doesn't clash with the host MySQL. Matches api/.env.
services:
  db:
    image: mysql:8.4
    container_name: gatezo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gatezo
      MYSQL_USER: gatezo
      MYSQL_PASSWORD: gatezo
    ports:
      - "3308:3306"
    volumes:
      - gatezo_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ugatezo", "-pgatezo"]
      interval: 5s
      retries: 20

volumes:
  gatezo_mysql:
